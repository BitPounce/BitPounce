name: Auto Version Update

on:
  push:
    branches:
      - main

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version.json
        run: |
          VERSION="1.0.0"
          BUILD=${{ github.run_number }}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -I)

          printf '{\n' > version.json
          printf '  "version": "%s",\n' "$VERSION" >> version.json
          printf '  "build": %s,\n' "$BUILD" >> version.json
          printf '  "commit": "%s",\n' "$COMMIT" >> version.json
          printf '  "date": "%s"\n' "$DATE" >> version.json
          printf '}\n' >> version.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add version.json
          git commit -m "Auto update version.json [skip ci]" || exit 0
          git push